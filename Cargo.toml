[package]
name = "total-analyzer"
version = "0.1.0"
edition = "2021"

[dependencies]
ruff_python_ast = "0.4.4"
ruff_python_parser = "0.4.4"
ruff_python_semantic = "0.4.4"
ruff_python_index = "0.4.4"
ruff_source_file = "0.4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
